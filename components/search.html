<div class="pr-search-panel" id="searchPanel" role="dialog" aria-label="Search this page" aria-modal="false">

  <div class="pr-search-top">

    <div class="pr-search-input-wrap">
      <input
        type="search"
        class="pr-search-input"
        id="searchInput"
        placeholder="Search this page..."
        autocomplete="off"
        aria-label="Search this page"
      >
    </div>

    <button class="pr-search-close" id="searchClose" type="button" aria-label="Close search">×</button>

  </div>

  <div class="pr-search-meta" id="searchMeta" aria-live="polite">
    Start typing to search
  </div>

  <div class="pr-search-results" id="searchResults"></div>

</div>
